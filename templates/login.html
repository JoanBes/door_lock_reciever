<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · LibraGate Door Control</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <form class="login-card" id="login-form" autocomplete="on">
    <div class="login-brand">
      <div class="brand-logo">{% include 'icons/library.svg' %}</div>
      <div><small>NORTHBRIDGE</small><strong>University Library</strong></div>
    </div>
    <h2>Access the library</h2>
    <p>Sign in with your administrator or student account.</p>
    <div class="field">
      <label for="username">Student ID / Email</label>
      <input class="input" id="username" name="username" placeholder="e.g. STU-2025-1842 or admin" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input class="input" id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
        <button type="button" id="toggle-password" aria-label="Show password">👁</button>
      </div>
    </div>
    <div class="form-error" id="login-error" role="alert"></div>
    <button class="btn primary" type="submit">Sign In</button>
  </form>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  <script>
    $("#toggle-password").addEventListener("click", () => {
      const input = $("#password");
      input.type = input.type === "password" ? "text" : "password";
    });
    $("#login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      $("#login-error").textContent = "";
      try {
        await api("/api/login", {
          method: "POST",
          body: JSON.stringify({ username: $("#username").value, password: $("#password").value }),
        });
        window.location.href = "/";
      } catch (error) {
        $("#login-error").textContent = error.message;
      }
    });
  </script>
</body>
</html>
